name: Familienbüro Pro auf GitHub Pages

# Baut die App und stellt sie unter
# https://lausiklauskn-png.github.io/Familienbuero-Pro/ bereit.
# Voraussetzung im Repo: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    name: Bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Bauen
        run: pnpm run build

      # GitHub Pages kann keine eigenen Kopfzeilen senden: Umwandler entpacken.
      - name: Für einfache Server vorbereiten
        run: node bin/einfacher-server.mjs dist

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  ausliefern:
    name: Ausliefern
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages stellen
        id: deployment
        uses: actions/deploy-pages@v5
