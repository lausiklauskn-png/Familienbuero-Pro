name: Dauerhafte Familienbüro-Pro-Signieridentität
# Familienbüro Pro (Klaus 27.11.2026): nur von Hand und nur von main. „initialize“ einmal, danach jederzeit „check“.
# Erzeugt den Schlüssel in GitHub Actions, legt nur das verschlüsselte Paket und den öffentlichen Fingerabdruck ab
# (Vorbild Datei-Organizer / BookLedgerPro). Die Freigabe FB_SIGNING_UNLOCK liegt nur in der Umgebung android-production.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Einmalig anlegen oder vorhandene Identität prüfen
        type: choice
        options: [check, initialize]
        default: check
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: familienbuero-signing-identity
  cancel-in-progress: false
jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: android-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Bestehende Identität und offene Initialisierung schützen
        if: inputs.operation == 'initialize'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if test -e signing/android-release.enc.json || test -e signing/android-certificate.json; then
            echo 'Identität bereits vorhanden. Kein neuer Schlüssel wird erzeugt.'
            exit 1
          fi
          if test -n "$(git ls-remote origin refs/heads/signing/android-identity)"; then
            echo 'Initialisierung ist bereits auf signing/android-identity vorhanden. Diese zuerst prüfen.'
            exit 1
          fi
          # Test-APKs (android-v…-test, Wegwerf-Schlüssel) und Windows-Releases zählen nicht; nur eine schon
          # dauerhaft signierte Android-Auslieferung verbietet einen neuen Schlüssel.
          signiert=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '[.[] | select((.tag_name | startswith("android-v")) and (.tag_name | contains("test") | not))] | length' \
            | awk '{n+=$1} END {print n+0}')
          if test "$signiert" -gt 0; then
            echo 'Signierte Android-Auslieferung bereits vorhanden. Bestehenden Schlüssel wiederherstellen, keine neue Identität erzeugen.'
            exit 1
          fi
      - name: Eigene Identität einmalig erstellen
        if: inputs.operation == 'initialize'
        env:
          FB_SIGNING_UNLOCK: ${{ secrets.FB_SIGNING_UNLOCK }}
          TMPDIR: ${{ runner.temp }}
        run: node tools/signing/cli.mjs init
      - name: Entschlüsselung und Zertifikatsbindung prüfen
        env:
          FB_SIGNING_UNLOCK: ${{ secrets.FB_SIGNING_UNLOCK }}
          TMPDIR: ${{ runner.temp }}
        run: node tools/signing/cli.mjs check
      - name: Nur verschlüsselte Identität und öffentlichen Fingerabdruck sichern
        if: always() && inputs.operation == 'initialize'
        uses: actions/upload-artifact@v4
        with:
          name: familienbuero-encrypted-signing-identity
          path: |
            signing/android-release.enc.json
            signing/android-certificate.json
          if-no-files-found: error
          retention-days: 90
      - name: Verschlüsselte Identität als eigenen PR bereitstellen
        if: inputs.operation == 'initialize'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c signing/android-identity
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- signing/android-release.enc.json signing/android-certificate.json
          git commit -m 'Eigene dauerhafte Android-Signieridentität verschlüsselt ablegen'
          git push origin HEAD:refs/heads/signing/android-identity
          gh pr create --base main --head signing/android-identity \
            --title 'Dauerhafte Familienbüro-Pro-Signieridentität' \
            --body 'Enthält ausschließlich die authentifiziert verschlüsselte eigene Signieridentität und den öffentlichen Zertifikatsfingerabdruck. Wiederherstellung wurde im Workflow geprüft. Die Entschlüsselungsfreigabe liegt separat im Secret FB_SIGNING_UNLOCK der Umgebung android-production.'
