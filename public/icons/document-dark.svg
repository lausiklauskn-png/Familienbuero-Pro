<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Familienbüro">
  <!-- Tab-Symbol: mit durchsichtigem Rand, damit es auf hellen und dunklen Reitern frei steht -->
  <g transform="translate(56 56) scale(0.78125)">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8fd0"/><stop offset="1" stop-color="#0b3154"/>
    </linearGradient>
    <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="weich" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9ade"/><stop offset="1" stop-color="#174f8f"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17497f"/><stop offset="1" stop-color="#0b3154"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0b3154" flood-opacity=".3"/>
    </filter>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#061d33" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect x="46" y="46" width="420" height="420" rx="84" fill="#fff" filter="url(#weich)"/><rect x="96" y="96" width="320" height="320" rx="70" fill="#fff" filter="url(#weich)"/></g>
  <g filter="url(#s)">
    <path d="M118 214 L236 112 Q256 96 276 112 L394 214 Q402 222 402 234 V384 Q402 412 374 412 H138 Q110 412 110 384 V234 Q110 222 118 214 Z" fill="url(#w)"/>
  </g>
  <g fill="#fff">
    <rect x="150" y="238" width="118" height="18" rx="9"/>
    <rect x="150" y="272" width="212" height="14" rx="7" opacity=".7"/>
    <rect x="150" y="298" width="170" height="14" rx="7" opacity=".7"/>
  </g>
  <g filter="url(#s2)">
    <rect x="232" y="318" width="204" height="130" rx="20" fill="url(#t)"/>
    <g fill="#fff">
      <rect x="250" y="336" width="74" height="26" rx="7"/><rect x="334" y="336" width="84" height="26" rx="7" opacity=".85"/>
      <rect x="250" y="370" width="74" height="26" rx="7" opacity=".85"/><rect x="334" y="370" width="84" height="26" rx="7" opacity=".7"/>
      <rect x="250" y="404" width="74" height="26" rx="7" opacity=".7"/><rect x="334" y="404" width="84" height="26" rx="7" opacity=".55"/>
    </g>
  </g>
</g>
</svg>
